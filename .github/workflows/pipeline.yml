# Continuous delivery for Meshasec Connext.
#
# Every push runs the quality gate (typecheck, lint, unit + property tests).
# The gate needs no secrets: vitest.config.ts pins the node environment and
# stubs `server-only`, so the suite never touches Prisma, Clerk, or the network.
#
# The deploy job is opt-in and only runs when the repository variable
# VERCEL_DEPLOY is set to "true". Leave it unset to let Vercel's native Git
# integration own deployments; set it to "true" to hand deployment to this
# pipeline so nothing reaches Vercel on a red build. Running both at once
# deploys every commit twice, see the note at the bottom of this file.
name: Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# A newer commit on the same ref makes the in-flight run obsolete. Production is
# excluded from cancellation so a promote is never killed half-way through.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # prisma.config.ts resolves env("DATABASE_URL") eagerly and throws when it is
    # absent, so every Prisma CLI invocation needs the variable set, including the
    # `prisma generate` that runs from `postinstall`. This placeholder is never
    # dialled: `generate` only reads the schema, and the test suite is pinned to
    # the node environment with no Prisma, Clerk, or network access. The real
    # credentials stay in the Vercel project.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # `postinstall` runs `prisma generate`, so the client the typecheck reads
      # exists from this step onward. No database connection is involved.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: verify
    # Pull requests are already covered by the push event on their head branch;
    # deploying them again would double the work for no extra signal.
    if: github.event_name == 'push' && vars.VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@59.17.0

      # master is production, every other branch is a preview. Both values are
      # read from the environment rather than interpolated into the script, so a
      # branch name containing shell metacharacters cannot inject a command.
      - name: Resolve deployment target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      # Fetches the project settings and the environment variables configured in
      # Vercel into .vercel/, which is why DATABASE_URL, the Clerk keys, the
      # LiveKit credentials and TRUSTED_APP_ORIGIN do not need to be duplicated
      # as GitHub secrets. They stay in one place: the Vercel project.
      - name: Pull Vercel environment
        run: |
          vercel pull --yes \
            --environment="${{ steps.target.outputs.environment }}" \
            --git-branch="$GITHUB_REF_NAME" \
            --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      # --prebuilt uploads the .vercel/output produced above instead of asking
      # Vercel to build the same commit a second time.
      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report deployment URL
        run: |
          {
            printf '### Deployed to %s\n\n' "${{ steps.target.outputs.environment }}"
            printf '%s\n' "${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
# Handing deployment to this pipeline
# -----------------------------------
# 1. Create a Vercel token, then add three repository secrets under
#    Settings > Secrets and variables > Actions > Secrets:
#      VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#    The two IDs are printed into .vercel/project.json by `vercel link`.
# 2. Add the repository variable VERCEL_DEPLOY = true on the Variables tab.
# 3. Turn off Vercel's own Git deployments so a push does not deploy twice, by
#    adding a vercel.json at the repository root containing:
#      { "git": { "deploymentEnabled": false } }
#
# Skipping step 3 while VERCEL_DEPLOY is true is the one combination to avoid.
